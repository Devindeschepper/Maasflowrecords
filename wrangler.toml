# Cloudflare Workers configuration — used by `npx wrangler deploy`
# (Cloudflare "Workers Builds" runs this automatically on every push to GitHub).
#
# The name must match the Worker's name in the Cloudflare dashboard.
name = "maasflowrecords2"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Builds the website (Astro → ./dist) before every deploy.
[build]
command = "npm run build"

# The website itself: the static Astro build.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Only the form/checkout API goes through the Worker code; pages are served directly.
run_worker_first = ["/api/*"]

# "In the studio" light (functions/api/studio.ts). Created in Cloudflare → Storage & databases → Workers KV.
[[kv_namespaces]]
binding = "STUDIO"
id = "22af6d99ff4a4d9d9cfb766ee2cf48d1"

# Studio sessions + knocks (hours and knock stats, /studio-stats/). Tables are created on first use.
[[d1_databases]]
binding = "DB"
database_name = "maasflow"
database_id = "f8871ad2-7c01-426e-a5c1-44870e073a5d"

# Every hour: follower snapshot. Sunday 18:00 UTC (19:00/20:00 Luxembourg): weekly summary on
# WhatsApp. The 1st at 08:00 UTC: monthly report on WhatsApp. (The Sunday and monthly strings must
# match WEEKLY_CRON and MONTHLY_CRON in worker/index.ts.)
[triggers]
crons = ["0 * * * *", "0 18 * * SUN", "0 8 1 * *"]

# Non-secret variables. Secrets (TURNSTILE_SECRET_KEY, RESEND_API_KEY, STRIPE_*, NOWPAYMENTS_*) are set in the
# Cloudflare dashboard (Settings → Variables and Secrets) or in .dev.vars for local dev.
[vars]
CONTACT_TO_EMAIL = "info@maasflowrecords.com"
# Cloudflare account id (not secret; also in every dashboard URL). Used for website visitors on /studio-stats/.
CF_ACCOUNT_ID = "81bec14c188ccd990d6bd257e425ead2"
# Web Analytics site tag of maasflowrecords.com (not secret). The API token CF_ANALYTICS_TOKEN is a secret.
CF_WEB_ANALYTICS_SITE = "d6a39ed565d04652aaa51126008b3906"

# Same values for preview deployments (non-production branches, `wrangler preview`).
[previews.vars]
CONTACT_TO_EMAIL = "info@maasflowrecords.com"

[observability]
enabled = true
